  services:
    postgres:
      image: postgres:17
      container_name: covoiturage-postgres
      restart: always
      environment:
        POSTGRES_DB: covoiturage_db
        POSTGRES_USER: covoiturage_user
        POSTGRES_PASSWORD: admin123
      ports:
        - "5432:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data

  volumes:
    postgres_data:
